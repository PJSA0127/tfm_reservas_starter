[project]
name = "tfm-reservas"
version = "0.1.0"
description = "Aplicación web demostrativa para el TFM de verificación continua basada en OWASP ASVS 5.0.0 L1"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Flask==3.1.3",
  "Flask-Login==0.6.3",
  "Flask-WTF==1.3.0",
  "SQLAlchemy==2.0.52",
  "psycopg[binary]==3.3.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
